app = 'test-feedback'
primary_region = 'syd'

[build]

[env]
  PORT = '8080'
  DATA_DIR = '/data'
  UPLOADS_DIR = '/data/uploads'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = 'exam_data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
